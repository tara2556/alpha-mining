[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpha-mining"
version = "0.1.0"
description = "Taiwan market alpha research workbench: formula alphas, auditable backtests, TradingView-style UI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "finback contributors" }]

[tool.hatch.build.targets.wheel]
packages = ["src/finback"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

