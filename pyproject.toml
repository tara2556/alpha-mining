[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finback-tw"
version = "0.1.0"
description = "A research-first backtesting toolkit for Taiwan stocks, futures, and options."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "finback contributors" }]

[tool.hatch.build.targets.wheel]
packages = ["src/finback"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

